name: Reproduce the published figures

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Counter characterization from the raw probe samples
        run: python analysis/probes_summary.py data/probes-mi210-2026-10-15 | tee probes.txt
      - name: DBSCAN study from the raw traces
        run: python analysis/dbscan_counter.py data/dbscan-mi210-2026-10-09 | tee dbscan.txt
      - name: Compare with the published figures
        run: |
          diff -u analysis/expected_probes.txt probes.txt
          diff -u analysis/expected_dbscan.txt dbscan.txt
